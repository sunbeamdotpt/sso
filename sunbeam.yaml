schema: 1
project:
  name: sso
  kind: node-ui
  description: "Sunbeam SSO admin frontend — Kratos identity & self-service flow management."
targets:
  build:
    exec: "deno task build"
  test:
    exec: "deno task test"
  lint:
    exec: "deno task lint"
  fmt:
    exec: "deno task fmt"
  dev:
    exec: "deno task dev"
  clean:
    exec: "rm -rf dist styled-system node_modules deno.lock"
  doc:
    exec: skip
  package:
    exec: "docker buildx build --push -t src.${SUNBEAM_REGISTRY}/studio/sso-ui:latest ."
deps:
  services: [kratos]
outputs:
  - dist
