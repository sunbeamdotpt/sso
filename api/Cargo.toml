[package]
name = "sso"
version = "1.0.0-rc8"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
sunbeam-g2v = { version = "0.3", default-features = false, features = [
    "axum",
    "metrics",
    "tracing",
    "logging",
] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rust-embed = { version = "8", features = ["include-exclude", "axum-ex"] }
mime_guess = "2"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
