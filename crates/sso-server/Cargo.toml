[package]
name = "sso-server"
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://src.sunbeam.pt/studio/sunbeam"
publish = false
description = "SSO identity admin UI server — static hosting + Ory proxy"

[dependencies]
sunbeam-g2v = { path = "../../../../libs/sunbeam-g2v" }

axum = { version = "0.8", features = ["http2", "macros"] }
tower.workspace = true
tower-http = { workspace = true, features = ["trace", "cors", "timeout", "fs", "set-header"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "cookies"] }
thiserror.workspace = true
anyhow.workspace = true
http.workspace = true
http-body-util.workspace = true
chrono.workspace = true
uuid.workspace = true
figment.workspace = true
urlencoding = "2"

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio-test.workspace = true
wiremock.workspace = true
tempfile.workspace = true
